<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Round Music Player — Server status</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 32px 20px;
      background: linear-gradient(to bottom, #238999, #313c60);
      font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color: #fff;
    }
    .wrap { max-width: 820px; margin: 0 auto; }
    h1 { font-size: 24px; margin: 0 0 4px; text-shadow: 0 2px 8px rgba(0,0,0,.4); }
    .sub { opacity: .8; margin: 0 0 22px; font-size: 14px; }
    .nav a { color: #7fe4ff; margin-right: 14px; }
    .card {
      background: rgba(0,0,0,.32); border: 1px solid rgba(255,255,255,.14);
      border-radius: 12px; padding: 18px 20px; margin-bottom: 16px;
      box-shadow: 0 6px 20px rgba(0,0,0,.3);
    }
    .card h2 { margin: 0 0 10px; font-size: 16px; }
    .row { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; line-height: 1.5; }
    .pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .ok { background: #1c7a46; color: #d7ffe6; }
    .warn { background: #8a5a00; color: #ffe9c2; }
    .err { background: #8a2a22; color: #ffd6d2; }
    pre { background: rgba(0,0,0,.4); padding: 12px; border-radius: 8px; overflow:auto; font-size: 12px; max-height: 320px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid rgba(255,255,255,.1); }
    th { opacity: .7; font-weight: 600; }
    .muted { opacity: .7; font-size: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🎧 Round Music Player — server status</h1>
    <p class="sub nav">
      <a href="hub.html">Launcher</a>
      <a href="index.html">Player</a>
      <a href="dev.html">Editor</a>
    </p>

    <div class="card">
      <h2>Backend</h2>
      <div id="ping" class="row">Checking /api/ping…</div>
    </div>

    <div class="card">
      <h2>Uploaded files <span id="upCount" class="muted"></span></h2>
      <div id="uploads" class="row">Loading…</div>
    </div>

    <div class="card">
      <h2>Saved theme</h2>
      <div id="theme" class="row">Loading…</div>
    </div>
  </div>

  <script>
    fetch('/api/ping').then(r => r.ok ? r.json() : null).then(j => {
      const el = document.getElementById('ping');
      if (!j || !j.ok){ el.innerHTML = '<span class="pill err">unreachable</span>'; return; }
      el.innerHTML =
        '<span class="pill ok">reachable</span>' +
        '<span>theme: <b>' + (j.themePresent ? 'present' : 'empty') + '</b></span>' +
        '<span>uploads: <b>' + j.uploadCount + '</b></span>' +
        '<span class="muted">server ' + (j.version || '') + '</span>';
    }).catch(() => { document.getElementById('ping').innerHTML = '<span class="pill err">fetch failed</span>'; });

    fetch('/api/uploads').then(r => r.ok ? r.json() : null).then(j => {
      const el = document.getElementById('uploads');
      const files = (j && j.files) || [];
      document.getElementById('upCount').textContent = '(' + files.length + ')';
      if (!files.length){ el.innerHTML = '<span class="muted">No files uploaded yet. Use the Editor to add tracks.</span>'; return; }
      const fmt = b => b < 1024 ? b + ' B' : b < 1048576 ? (b/1024).toFixed(1) + ' KB' : (b/1048576).toFixed(1) + ' MB';
      el.innerHTML = '<table><thead><tr><th>File</th><th>Size</th><th>Link</th></tr></thead><tbody>' +
        files.map(f => '<tr><td>' + f.name + '</td><td>' + fmt(f.size) + '</td><td><a href="' + f.url + '" target="_blank">open</a></td></tr>').join('') +
        '</tbody></table>';
    }).catch(() => { document.getElementById('uploads').innerHTML = '<span class="pill warn">could not list</span>'; });

    fetch('/api/theme').then(r => r.ok ? r.json() : null).then(j => {
      const el = document.getElementById('theme');
      if (!j){ el.innerHTML = '<span class="pill warn">no theme</span>'; return; }
      const tracks = Array.isArray(j.tracks) ? j.tracks.length : 0;
      const vars = j.vars ? Object.keys(j.vars).length : 0;
      const hasTitle = !!j.title;
      el.innerHTML =
        '<span>vars: <b>' + vars + '</b></span>' +
        '<span>tracks: <b>' + tracks + '</b></span>' +
        '<span>title: <b>' + (hasTitle ? j.title : '—') + '</b></span>' +
        '<span class="muted">updatedAt: ' + (j.updatedAt ? new Date(j.updatedAt).toLocaleString() : 'never') + '</span>' +
        '<details style="width:100%;margin-top:8px"><summary class="muted">raw JSON</summary><pre>' +
        JSON.stringify(j, null, 2).replace(/</g,'&lt;') + '</pre></details>';
    }).catch(() => { document.getElementById('theme').innerHTML = '<span class="pill warn">could not read</span>'; });
  </script>
</body>
</html>
